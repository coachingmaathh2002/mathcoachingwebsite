<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raj Sir Math Academy - Master Mathematics with Confidence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'serif-royal': ['Cinzel', 'Playfair Display', 'serif'],
              'display': ['Playfair Display', 'Cinzel', 'serif'],
              'academic': ['Cormorant Garamond', 'serif'],
              'body': ['Plus Jakarta Sans', 'Noto Sans Bengali', 'sans-serif'],
              'bengali': ['Noto Sans Bengali', 'sans-serif'],
            },
            colors: {
              // Ultra-Premium Obsidian & Navy-Tinted Dark Palette
              dark: {
                950: '#07090e', // Deep Obsidian
                900: '#0c1017', // Midnight Base
                850: '#111722', // Card Surface
                800: '#172030', // Elevated Surface
                750: '#1e293f', // Hover Surface
                700: '#2b3952', // Borders
              },
              brand: {
                gold: '#d4af37',       // Pure Imperial Gold
                goldLight: '#f6e4a6',  // Champagne Gold
                goldDark: '#aa820a',   // Deep Burnished Gold
                amber: '#f59e0b',      // Warm Amber
                champagne: '#faf5ea',  // Off-white Champagne
                silver: '#e2e8f0',     // Platinum Silver
                glow: '#fef08a',       // Soft Halo Glow
              },
              surface: '#0c1017',
            },
            backgroundImage: {
              'hero-gradient': 'radial-gradient(ellipse at 50% 0%, #162035 0%, #0c1017 60%, #07090e 100%)',
              'card-gradient': 'linear-gradient(155deg, rgba(23,32,48,0.7) 0%, rgba(12,16,23,0.9) 100%)',
              'card-gold-glow': 'linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(12,16,23,0.95) 100%)',
              'accent-gradient': 'linear-gradient(135deg, #d4af37 0%, #fff2be 50%, #c59b27 100%)',
              'gold-sheen': 'linear-gradient(90deg, transparent, rgba(212,175,55,0.25), transparent)',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 3s ease-in-out infinite',
            },
            keyframes: {
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #07090e;
        --accent: #d4af37;
      }
      
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
        background-color: #07090e;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Luxury Gold Borders & Accents */
      .gold-gradient-border {
        border-image: linear-gradient(135deg, #d4af37, rgba(212,175,55,0.2), #aa820a) 1;
      }

      .gold-text-sheen {
        background: linear-gradient(135deg, #f7e7ce 0%, #d4af37 50%, #fef3c7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gold-glow {
        box-shadow: 0 0 35px -5px rgba(212, 175, 55, 0.25);
      }

      .glass-luxury {
        background: rgba(12, 16, 23, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(212, 175, 55, 0.18);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .glass-nav {
        background: rgba(7, 9, 14, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-bottom: 1px solid rgba(212, 175, 55, 0.15);
      }

      .academic-badge {
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.12) 0%, rgba(212, 175, 55, 0.03) 100%);
        border: 1px solid rgba(212, 175, 55, 0.35);
        box-shadow: 0 2px 10px rgba(212, 175, 55, 0.08);
      }

      /* Animations */
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(15px, -15px) rotate(5deg); }
        66% { transform: translate(-10px, 10px) rotate(-5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-20px, -10px) rotate(10deg); }
      }
      
      .animate-float-1 { animation: float1 15s ease-in-out infinite; }
      .animate-float-2 { animation: float2 20s ease-in-out infinite; }
      
      /* Glowing Text */
      .text-glow {
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      }

      /* Premium Selection */
      ::selection {
        background-color: rgba(212, 175, 55, 0.3);
        color: #ffffff;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      .animate-fadeIn {
        animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4af37; 
      }

      .glass-nav {
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .glass-card {
        background: rgba(24, 24, 27, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
