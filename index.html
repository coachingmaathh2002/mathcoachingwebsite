<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raj Sir Math Academy - Master Mathematics with Confidence</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              'display': ['Playfair Display', 'serif'],
              'body': ['Plus Jakarta Sans', 'Noto Sans Bengali', 'sans-serif'],
              'bengali': ['Noto Sans Bengali', 'sans-serif'],
            },
            colors: {
              // Premium Dark Palette
              dark: {
                950: '#09090b', // Deepest Zinc/Black
                900: '#18181b', // Main Background
                800: '#27272a', // Card Background
                700: '#3f3f46', // Borders
              },
              brand: {
                gold: '#d4af37',   // Metallic Gold
                light: '#fde047',  // Yellow 300
                silver: '#e2e8f0', // Silver
                glow: '#fef08a',   // Yellow 200
              },
              surface: '#18181b',
            },
            backgroundImage: {
              'hero-gradient': 'radial-gradient(circle at top right, #18181b 0%, #09090b 100%)',
              'card-gradient': 'linear-gradient(145deg, #18181b 0%, #09090b 100%)',
              'accent-gradient': 'linear-gradient(to right, #d4af37, #fef08a, #d4af37)',
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --bg: #09090b;
        --accent: #d4af37;
      }
      
      html {
        scroll-behavior: smooth;
        overflow-x: hidden;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
        background-color: #09090b;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      /* Animations */
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(15px, -15px) rotate(5deg); }
        66% { transform: translate(-10px, 10px) rotate(-5deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0) rotate(0deg); }
        50% { transform: translate(-20px, -10px) rotate(10deg); }
      }
      
      .animate-float-1 { animation: float1 15s ease-in-out infinite; }
      .animate-float-2 { animation: float2 20s ease-in-out infinite; }
      
      /* Glowing Text */
      .text-glow {
        text-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
      }

      /* Premium Selection */
      ::selection {
        background-color: rgba(212, 175, 55, 0.3);
        color: #ffffff;
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }

      .animate-fadeIn {
        animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #09090b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d4af37; 
      }

      .glass-nav {
        background: rgba(9, 9, 11, 0.8);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .glass-card {
        background: rgba(24, 24, 27, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body class="bg-dark-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
